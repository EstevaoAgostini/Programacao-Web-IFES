<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercícios de MENU 11</title>
    <style>
        body {
            font-size:12px;
            font-family:sans-serif;
            background:#b8e3ef;
            text-align:center;
        }
        .container {
            left:50%;
            top:50%;
            position: absolute;
            transform:translate(-50%,-50%);
            width:100%;
            max-width:350px;
        }
        .div{
            background-color: #93C7D6;
            color: white;
            padding: 15px;
            border: #6FABBC;
            border-radius: 6px;
        }
        .container :hover{
            background-color: #6FABBC;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="div">PÁGINA INICIAL</div>
        <div class="div">O IFES</div>
        <div class="div">CURSOS</div>
        <div class="div">PROCESSOS SELETIVOS</div>
        <div class="div">INOVAÇÃO</div>
    </div>
</body>
</html>
