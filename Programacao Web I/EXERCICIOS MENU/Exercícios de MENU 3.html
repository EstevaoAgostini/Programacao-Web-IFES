<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MENU</title>
    <style>
        .menu {
            display: flex;
            flex-direction: row;
            background-color: #F4F4F4;
            font-family: 'Times New Roman', Times, serif;
        }
        .menu div {
            padding: 15px;
            font-size: medium;
            border: solid black 1px;
        }
        .menu div:hover{
            background-color: #DDDDDD;
        }
    </style>
</head>
<body>
    <div class="menu">
        <div>Início</div>
        <div>Sobre</div>
        <div>Serviços</div>
        <div>Portifólio</div>
        <div>Contato</div>
    </div>
</body>
</html>
