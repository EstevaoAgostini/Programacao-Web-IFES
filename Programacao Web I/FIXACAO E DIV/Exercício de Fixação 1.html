<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de Fixação 1</title>
    <style type="text/css">
        .conteiner{
            display: flex;
            flex-direction: column;
        }
        .filho{
            margin: 0px;
            height: 30px;
            width: 100px;
            border: black solid 1px;
        }
        .filho:nth-child(even){
            background-color: dodgerblue;
        }
        .filho:nth-child(odd){
            background-color: #8A2BE2;
        }
    </style>
</head>
<body>
     <div class="conteiner">
        <div class="filho"></div>
        <div class="filho"></div>
        <div class="filho"></div>
        <div class="filho"></div>
        <div class="filho"></div>
    </div>
</body>
</html>
