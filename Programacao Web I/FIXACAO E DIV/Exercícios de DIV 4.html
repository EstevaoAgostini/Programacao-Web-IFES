<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style type="text/css">
        p{
            text-align: center;
            margin: 0%;
            font-family: 'Times New Roman', Times, serif;
        }
        .amarelo{
            background-color: yellow;
            height: 30px;
        }
        .azul{
            background-color: blue;
            color: white;
            height: 200px;
        }
        .roxo{
            background-color: purple;
            color: white;
            height: 80px;
        }
        .rosa{
            background-color: pink;
            height: 30px;
        }
    </style>
</head>

<body>
    <div>
        <p class="amarelo">CABEÇALHO</p>
        <p class="azul">CONTEÚDO</p>
        <p class="roxo">MENU</p>
        <p class="rosa">RODAPÉ</p>
    </div>
</body>

</html>
