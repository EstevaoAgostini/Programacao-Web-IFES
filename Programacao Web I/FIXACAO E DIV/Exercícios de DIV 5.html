<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercícios de DIV 5</title>
    <style type="text/css">
        p{
            margin: 0px;
        }
        .conteiner{
            text-align: center;
            font-family: 'Times New Roman', Times, serif;
        }
        .verde{
            background-color: lime;
            height: 30px;
        }
        .azul{
            background-color: blue;
            color: white;
            height: 20px;
        }
        .conteudo{
            background-color: black;
            color: white;
            height: 200px;
        }
        .p1{
            background-color: yellow;
            color: blue;
        }
        .p2{
            background-color: orange;
            color: red;
        }
        .p3{
            background-color: violet;
            color: white;
        }
        .preto{
            color: black;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <p class="verde">CABEÇALHO</p>
        <p class="azul">MENU</p>
        <div class="conteudo">
            <p>CONTEÚDO</p>
            <p class="p1"><span class="preto">parágrafo 1 -</span> Yellow</p>
            <p class="p2"><span class="preto">parágrafo 2 -</span> Orange</p>
            <p class="p3"><span class="preto">parágrafo 3 -</span>Violet</p>
        </div>
        <p class="verde">RODAPÉ</p>
    </div>
</body>
</html>
