<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>

<body>
    <form>
        <div>
            <div>Nome</div>
            <div><input type="text" name="Nome"></div>
        </div>
        <hr>
        <div>
            <div>
                Esportes</div>
            <div>
                <input type="checkbox" name="esp" value="1">Futebol <br>
                <input type="checkbox" name="esp" value="2">Volei <br>
                <input type="checkbox" name="esp" value="3">Natação <br>
                <input type="checkbox" name="esp" value="4">Karatê
            </div>
        </div>
        <hr>
        <div>Linguagem de Programação</div>
        <div>
            <select name="prog">
                <option> Escolha:</option>
                <option value="1">Java</option>
                <option value="2">PHP</option>
                <option value="3">C#</option>
                <option value="4">JS</option>
            </select>
        </div>
        <hr>
        <div>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </div>
    </form>
</body>

</html>
