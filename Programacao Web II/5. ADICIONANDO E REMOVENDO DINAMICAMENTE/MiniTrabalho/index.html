<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini-Trabalho – Javascript DOM</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <!--Inicio-->
    <div id="inicioContainer">
        <button class="botao" onclick="areaAluno()">ALUNO</button> 
        <button class="botao"  onclick="areaProfessor()">PROFESSOR</button>
    </div>
    <!--Aluno-->
    <div class="containerAluno" id="containerAluno">
        <div id="listaAlunos"></div>
        <button class="botao" onclick="criarAluno()">Criar Aluno</button>
    </div>
    <!--Professor-->
    <div class="containerProfessor" id="containerProfessor">
        <div id="listaProfessores"></div>
        <button class="botao" onclick="criarProfessor()">Criar Professor</button>
    </div>
</body>
</html>
