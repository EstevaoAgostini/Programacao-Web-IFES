<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 1 – Javascript</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <!--ATIVIDADE 1-->
    <div class="container">
        <h2>1 – Lanche Vitalício</h2>

        <input id="idadeAtual" type="text" placeholder="Idade atual:">
        <input id="idadeEsperada" type="text" placeholder="Idade máxima esperada:">
        <input id="lanchesPorDia" type="text" placeholder="Lanches por dia:">

        <textarea name="LancheVitalicio" id="LancheVitalicio" placeholder="O resulado aparecerá aqui!"></textarea>
        <button onclick="calcularLanches()">Calcular</button>

    </div>
    <br>
    <!--ATIVIDADE 2-->
    <div class="container">
        <h2>2 – Propriedades de um Círculo</h2>

        <input id="raioCirculo" type="text" placeholder="Informe o raio do círculo:">
        <textarea name="circunferencia" id="circunferencia" placeholder="O resulado aparecerá aqui!"></textarea>

        <button onclick="calcularCircunferencia()">Calcular</button>
    </div>
    <br>
    <!--ATIVIDADE 3-->
    <div class="container">
        <h2>3 – Tradutor de Olá Mundo</h2>

        <select id="escolhaIdioma">
            <option value="" disabled selected>Escolha o idioma:</option>
            <option id="fr" value="fr">Francês</option>
            <option id="es" value="es">Espanhol</option>
            <option id="it" value="it">Italiano</option>
            <option id="ru" value="ru">Russo</option>
            <option id="la" value="la">Latim</option>
            <option id="su" value="su">Sueco</option>
            <option value="outro">Outro</option>
        </select>

        <textarea name="olamundo" id="olamundo" placeholder="O resulado aparecerá aqui!"></textarea>
        <button onclick="traduzirIdioma()">Traduzir</button>
    </div>
    <br>
    <!--ATIVIDADE 4-->
    <div class="container">
        <h2>4 – Impressão de Padrão</h2>

        <textarea name="padrao" id="padrao" placeholder="O resulado aparecerá aqui!"></textarea>
        <button onclick="gerarPadrao()">Gerar Padrão</button>
    </div>
</body>

</html>
