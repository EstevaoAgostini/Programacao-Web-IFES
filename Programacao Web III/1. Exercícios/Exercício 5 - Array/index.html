<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 1 – Javascript Array</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <!--ATIVIDADE 1-->
    <div class="container">
        <h2>1 – Escolhas</h2>

        <textarea name="escolha" id="escolha" placeholder="O resulado aparecerá aqui!"></textarea>
        <button onclick="escolhas()">Exibir escolhas</button>

    </div>
    <br>

    <!--ATIVIDADE 2-->
    <div class="container">
        <h2>2 – Quadrados</h2>

        <textarea name="quadrado" id="quadrado" placeholder="O resulado aparecerá aqui!"></textarea>

        <button onclick="quadrado()">Calcular quadrados</button>
    </div>
    <br>

    <!--ATIVIDADE 3-->
    <div class="container">
        <h2>3 – Números Romanos</h2>

        <textarea name="romano" id="romano" placeholder="O resulado aparecerá aqui!"></textarea>
        <button onclick="romanos()">Exibir números romanos</button>
    </div>
</body>

</html>
