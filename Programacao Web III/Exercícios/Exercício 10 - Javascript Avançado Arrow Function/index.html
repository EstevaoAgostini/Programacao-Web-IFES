<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 10</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <!-- Container principal -->
<div class="container">
    <!-- Imagens com o rótulo -->
    <div class="meuSlide desaparecer">
        <div class="numero">1 / 3</div>
        <img src="img/img1.jpg">
        <div class="rotulo">Carro 1</div>
    </div>

    <div class="meuSlide desaparecer">
        <div class="numero">2 / 3</div>
        <img src="img/img2.jpg">
        <div class="rotulo">Carro 2</div>
    </div>

    <div class="meuSlide desaparecer">
        <div class="numero">3 / 3</div>
        <img src="img/img3.jpg">
        <div class="rotulo">Carro 3</div>
    </div>
    
    <!-- Botão anterior e próximo -->
    <a class="anterior" onclick="maisSlide(-1)">&#10094;</a>
    <a class="proximo" onclick="maisSlide(1)">&#10095;</a>
</div>
</body>
</html>
