<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 1 – Javascript</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <div class="container">
        <h2>1 – Lanche Vitalício</h2>

        <label for="idadeAtual">Idade atual:</label>
        <input id="idadeAtual" type="text">

        <label for="idadeMaxima">Idade máxima esperada:</label>
        <input id="idadeEsperada" type="text">

        <label for="lanchesPorDia">Lanches por dia:</label>
        <input id="lanchesPorDia" type="text">

        <button onclick="calcularLanches()">Calcular</button>

    </div>
    <br>

    <div class="container">
        <h2>2 – Propriedades de um Círculo</h2>

        <label for="raioCirculo">Informe o raio do círculo:</label>
        <input id="raioCirculo" type="text">

        <button onclick="calcularCircunferencia()">Calcular</button>
    </div>
    <br>

    <div class="container">
        <h2>3 – Tradutor de Olá Mundo</h2>

        <label for="escolhaIdioma">Escolha o idioma:</label>
        <select id="escolhaIdioma">
            <option id="pt" value="pt">Português</option>
            <option id="en" value="en">Inglês</option>
            <option id="es" value="es">Espanhol</option>
            <option id="fr" value="fr">Francês</option>
            <option id="it" value="it">Italiano</option>
        </select>

        <button onclick="traduzirIdioma()">Traduzir</button>
    </div>
    <br>

    <div class="container">
        <h2>4 – Impressão de Padrão</h2>

        <label for="gerarPadrao"></label>
        <button onclick="gerarPadrao()">Gerar Padrão</button>
    </div>
</body>

</html>
