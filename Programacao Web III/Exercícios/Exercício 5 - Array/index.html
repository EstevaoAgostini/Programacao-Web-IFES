<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 1 – Javascript Array</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <!--ATIVIDADE 1-->
    <div class="container">
        <h2>1 – Escolhas</h2>

        <textarea name="escolha" id="escolha" placeholder="O resulado aparecerá aqui!"></textarea>
        <button onclick="escolhas()">Calcular</button>

    </div>
    <br>

    <!--ATIVIDADE 2-->
    <div class="container">
        <h2>2 – Quadrados</h2>

        <textarea name="quadrado" id="quadrado" placeholder="O resulado aparecerá aqui!"></textarea>

        <button onclick="quadrado()">Calcular</button>
    </div>
    <br>

    <!--ATIVIDADE 3-->
    <div class="container">
        <h2>3 – Tradutor de Olá Mundo</h2>

        <select id="escolhaIdioma">
            <option value="" disabled selected>Escolha o idioma:</option>
            <option id="fr" value="fr">Francês</option>
            <option id="es" value="es">Espanhol</option>
            <option id="it" value="it">Italiano</option>
            <option id="ru" value="ru">Russo</option>
            <option id="la" value="la">Latim</option>
            <option id="su" value="su">Sueco</option>
            <option value="outro">Outro</option>
        </select>

        <textarea name="olamundo" id="olamundo" placeholder="O resulado aparecerá aqui!"></textarea>
        <button onclick="traduzirIdioma()">Traduzir</button>
    </div>
</body>

</html>
